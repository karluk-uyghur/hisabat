<!DOCTYPE html>
<html lang="ug" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ھېسابات باشقۇرۇش سىستېمىسى</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UKIJ+Tuz&display=swap');
        
        * {
            font-family: 'UKIJ Tuz', system-ui, -apple-system, sans-serif;
        }

        /* Glassmorphic Effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .dark .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.6);
        }

        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4);
        }

        .badge-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 pb-16">

    <!-- Background Decorative Blobs -->
    <div class="fixed top-0 left-0 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none -z-10 animate-float"></div>
    <div class="fixed bottom-0 right-0 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none -z-10 animate-float" style="animation-delay: -3s;"></div>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-6 space-y-6">

        <!-- HEADER & TOP BANNER -->
        <header class="glass-card rounded-3xl p-5 sm:p-7 relative overflow-hidden shadow-2xl">
            <!-- Top Gradient Bar -->
            <div class="absolute top-0 right-0 left-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                
                <!-- Logo & Title -->
                <div class="flex items-center gap-4 text-center md:text-right">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                        <i data-lucide="wallet" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 dark:from-indigo-400 dark:via-purple-300 dark:to-pink-400 bg-clip-text text-transparent">
                            ھېسابات باشقۇرۇش سىستېمىسى
                        </h1>
                        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">زامانىۋى ئېقىم ۋە ئايلىق ھېساباتلارنى رېشاتكىلىق تەپتىش قىلىش</p>
                    </div>
                </div>

                <!-- TOP PROMINENT COUNTER BADGE & CONTROLS -->
                <div class="flex flex-wrap items-center justify-center md:justify-end gap-3 w-full md:w-auto">
                    
                    <!-- PROMINENT TOTAL ACCOUNTS BADGE -->
                    <div class="flex items-center gap-2 bg-gradient-to-r from-emerald-500 via-teal-600 to-cyan-600 text-white px-5 py-2.5 rounded-2xl shadow-lg shadow-emerald-500/25 badge-glow font-bold text-sm sm:text-base border border-emerald-400/30">
                        <i data-lucide="users" class="w-5 h-5 animate-pulse"></i>
                        <span>جەمئىي ھېساباتلار:</span>
                        <span id="topTotalCount" class="text-xl font-extrabold bg-white/20 px-2.5 py-0.5 rounded-lg">0</span>
                    </div>

                    <!-- Theme Toggle Button -->
                    <button onclick="toggleTheme()" class="p-2.5 rounded-2xl bg-slate-200/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 hover:scale-105 transition shadow-sm border border-slate-300/50 dark:border-slate-700/50" title="تېما ئۆزگەرتىش">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-amber-400"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden text-indigo-600"></i>
                    </button>

                    <!-- Import/Export Tools Toggle -->
                    <button onclick="toggleDataMenu()" class="p-2.5 rounded-2xl bg-slate-200/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 hover:scale-105 transition shadow-sm border border-slate-300/50 dark:border-slate-700/50" title="زاپاسلاش / يۈكلەش">
                        <i data-lucide="database" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Backup Dropdown Menu -->
            <div id="dataMenu" class="hidden mt-4 pt-4 border-t border-slate-200/50 dark:border-slate-700/50 flex flex-wrap gap-3 justify-end text-xs">
                <button onclick="exportData()" class="flex items-center gap-1.5 px-3 py-2 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300 rounded-xl hover:bg-indigo-100 transition border border-indigo-200 dark:border-indigo-800">
                    <i data-lucide="download" class="w-4 h-4"></i> زاپاس ھۆججەت چىقىرىش (Export)
                </button>
                <label class="flex items-center gap-1.5 px-3 py-2 bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-300 rounded-xl hover:bg-purple-100 transition border border-purple-200 dark:border-purple-800 cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4"></i> زاپاس يۈكلەش (Import)
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </header>

        <!-- TOP SEARCH BAR & INSTANT SEARCH RESULTS -->
        <section class="glass-card rounded-3xl p-5 shadow-xl relative">
            <div class="relative flex items-center">
                <input type="text" id="searchInput" oninput="handleSearch()" 
                    placeholder="ئىسىم، كۇچا ياكى ئۆي نومۇرى ئارقىلىق تېز ئىزدەش..." 
                    class="w-full pr-12 pl-12 py-3.5 bg-slate-50/80 dark:bg-slate-900/80 border-2 border-indigo-500/40 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 focus:outline-none transition text-sm sm:text-base text-slate-800 dark:text-slate-100 placeholder-slate-400">
                <i data-lucide="search" class="w-6 h-6 absolute right-4 text-indigo-500"></i>
                <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute left-4 text-slate-400 hover:text-rose-500 transition">
                    <i data-lucide="x-circle" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Instant Search Results Panel -->
            <div id="searchResultsArea" class="hidden mt-4 pt-4 border-t border-slate-200/50 dark:border-slate-800 space-y-3">
                <div class="flex items-center justify-between text-xs font-bold text-indigo-600 dark:text-indigo-400 px-1">
                    <span id="searchResultCount">ئىزدەش نەتىجىلىرى:</span>
                    <button onclick="clearSearch()" class="text-slate-400 hover:text-rose-500 underline">ئىزدەشنى يېپىش</button>
                </div>
                <div id="searchResultsList" class="space-y-4"></div>
            </div>
        </section>

        <!-- FORM CARD (ENTRY & EDIT) -->
        <section id="formCard" class="glass-card rounded-3xl p-5 sm:p-7 shadow-xl transition-all duration-300 relative">
            <div class="flex items-center justify-between border-b border-slate-200/60 dark:border-slate-800 pb-4 mb-5">
                <div class="flex items-center gap-2">
                    <div id="formIconBg" class="w-9 h-9 rounded-xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                        <i data-lucide="user-plus" id="formIcon" class="w-5 h-5"></i>
                    </div>
                    <h2 class="text-base sm:text-lg font-bold" id="formTitleText">يېڭى ھېسابات كىرگۈزۈش</h2>
                </div>
                <span id="editBadge" class="hidden bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/30 text-xs font-bold px-3 py-1 rounded-full animate-pulse">
                    تەھرىرلىنىۋاتىدۇ
                </span>
            </div>

            <form id="accountForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <input type="hidden" id="editId">

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Name -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">ئىسىم *</label>
                        <div class="relative">
                            <input type="text" id="name" required placeholder="مەسئۇل كىشى ئىسمى"
                                class="w-full px-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                        </div>
                    </div>

                    <!-- Account Name -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">ھېسابات ئىسمى / نومۇرى *</label>
                        <input type="text" id="accountName" required placeholder="ھېسابات نومۇرى"
                            class="w-full px-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                    </div>

                    <!-- Password with Toggle -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">مەخپىي نومۇرى</label>
                        <div class="relative flex items-center">
                            <input type="password" id="password" placeholder="مەخپىي نومۇرى"
                                class="w-full pl-20 pr-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                            <button type="button" onclick="togglePasswordInput()" 
                                class="absolute left-2 text-xs font-bold px-2 py-1 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-300 transition">
                                كۆرسىتىش
                            </button>
                        </div>
                    </div>

                    <!-- Flow Amount -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">ئېقىم مىقدارى</label>
                        <input type="text" id="flowAmount" placeholder="مەسىلەن: 100M / 1000GB"
                            class="w-full px-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                    </div>

                    <!-- Open Date -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">ئاچقان ۋاقتى</label>
                        <input type="date" id="openDate"
                            class="w-full px-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                    </div>

                    <!-- Street Name -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">كۇچا ئىسمى</label>
                        <input type="text" id="streetName" placeholder="كۇچا ئىسمى"
                            class="w-full px-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                    </div>

                    <!-- House Number -->
                    <div class="sm:col-span-2 lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">ئۆي نومۇرى</label>
                        <input type="text" id="houseNumber" placeholder="ئۆي نومۇرى"
                            class="w-full px-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                    </div>

                    <!-- Notes -->
                    <div class="sm:col-span-2 lg:col-span-2">
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">ئىزاھات</label>
                        <input type="text" id="notes" placeholder="قوشۇمچە ئىزاھاتلار..."
                            class="w-full px-3.5 py-2.5 bg-slate-50/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs sm:text-sm">
                    </div>
                </div>

                <!-- 12 Months Payment Interactive Grid -->
                <div class="pt-2">
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-200 mb-2.5">
                        12 ئايلىق پۇل تۆلەش ھالىتى (پۇل بەرگەن ئايلارنى بەلگەڭ):
                    </label>
                    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
                        <script>
                            for(let i=1; i<=12; i++) {
                                document.write(`
                                    <label class="flex items-center justify-between px-3 py-2 bg-slate-100/70 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 rounded-xl cursor-pointer hover:border-indigo-500 transition text-xs select-none">
                                        <span class="font-bold text-slate-700 dark:text-slate-300">${i}-ئاي</span>
                                        <input type="checkbox" id="m${i}" class="w-4 h-4 text-indigo-600 accent-indigo-600 rounded">
                                    </label>
                                `);
                            }
                        </script>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-3 pt-3">
                    <button type="submit" id="saveBtn" 
                        class="flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3 px-5 rounded-2xl shadow-lg shadow-indigo-500/25 transition text-sm flex items-center justify-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span id="saveBtnText">ئۆزگەرتىشنى ساقلاش</span>
                    </button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" 
                        class="hidden bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-5 rounded-2xl shadow transition text-sm flex items-center justify-center gap-2">
                        <i data-lucide="x" class="w-4 h-4"></i>
                        <span>بىكار قىلىش</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- MAIN RECORDS LIST -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-2">
                <h2 class="text-base sm:text-lg font-extrabold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                    <i data-lucide="list-checks" class="w-5 h-5 text-indigo-500"></i>
                    ساقلانغان ھېساباتلار جەريانى
                </h2>
            </div>

            <!-- Record Cards Container -->
            <div id="allRecordsContainer" class="space-y-4"></div>
        </section>

    </div>

    <!-- GLOBAL CONFIRMATION MODAL -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-950/50 text-rose-500 mx-auto flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">ھېساباتنى ئۆچۈرۈش</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">بۇ ھېساباتنى ئۆچۈرۈشنى جەزملەشتۈرەمسىز؟ بۇ مەشغۇلاتنى يېنىۋالغىلى بولمايدۇ.</p>
            <div class="flex gap-3 pt-2">
                <button id="confirmDeleteBtn" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs transition">ئۆچۈرۈش</button>
                <button onclick="closeDeleteModal()" class="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">بىكار قىلىش</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        let records = [];
        let pendingDeleteId = null;

        // Initialize App & Icons
        window.onload = function() {
            lucide.createIcons();
            loadTheme();
            
            const savedData = localStorage.getItem('uyghur_hesabat_v2');
            if (savedData) {
                try {
                    records = JSON.parse(savedData);
                } catch(e) {
                    records = [];
                }
            }
            renderRecords();
            updateTopBadge();
        };

        // Theme Toggle Logic
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }

        function toggleDataMenu() {
            document.getElementById('dataMenu').classList.toggle('hidden');
        }

        function saveData() {
            localStorage.setItem('uyghur_hesabat_v2', JSON.stringify(records));
            renderRecords();
            updateTopBadge();
            handleSearch();
        }

        function updateTopBadge() {
            const countEl = document.getElementById('topTotalCount');
            if (countEl) {
                countEl.innerText = records.length;
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const editId = document.getElementById('editId').value;
            const months = [];
            for(let i = 1; i <= 12; i++) {
                months.push(document.getElementById('m' + i).checked);
            }

            const recordData = {
                id: editId ? editId : Date.now().toString(),
                name: document.getElementById('name').value.trim(),
                accountName: document.getElementById('accountName').value.trim(),
                password: document.getElementById('password').value,
                flowAmount: document.getElementById('flowAmount').value.trim(),
                openDate: document.getElementById('openDate').value,
                streetName: document.getElementById('streetName').value.trim(),
                houseNumber: document.getElementById('houseNumber').value.trim(),
                notes: document.getElementById('notes').value.trim(),
                months: months
            };

            if (editId) {
                const index = records.findIndex(r => r.id === editId);
                if (index !== -1) records[index] = recordData;
            } else {
                records.unshift(recordData);
            }

            saveData();
            resetForm();
        }

        function editRecord(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('name').value = item.name || '';
            document.getElementById('accountName').value = item.accountName || '';
            document.getElementById('password').value = item.password || '';
            document.getElementById('flowAmount').value = item.flowAmount || '';
            document.getElementById('openDate').value = item.openDate || '';
            document.getElementById('streetName').value = item.streetName || '';
            document.getElementById('houseNumber').value = item.houseNumber || '';
            document.getElementById('notes').value = item.notes || '';

            for (let i = 1; i <= 12; i++) {
                document.getElementById('m' + i).checked = item.months ? item.months[i - 1] : false;
            }

            document.getElementById('formTitleText').innerText = 'ھېساباتنى تەھرىرلەش';
            document.getElementById('saveBtnText').innerText = 'ئۆزگەرتىشنى ساقلاش';
            document.getElementById('cancelBtn').classList.remove('hidden');
            document.getElementById('editBadge').classList.remove('hidden');
            
            const formCard = document.getElementById('formCard');
            formCard.classList.add('ring-2', 'ring-amber-500');

            formCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function promptDelete(id) {
            pendingDeleteId = id;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('confirmDeleteBtn').onclick = function() {
                if (pendingDeleteId) {
                    records = records.filter(r => r.id !== pendingDeleteId);
                    saveData();
                    if (document.getElementById('editId').value === pendingDeleteId) {
                        resetForm();
                    }
                    closeDeleteModal();
                }
            };
        }

        function closeDeleteModal() {
            pendingDeleteId = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function toggleMonthStatus(id, monthIdx) {
            const item = records.find(r => r.id === id);
            if (item) {
                if (!item.months) item.months = Array(12).fill(false);
                item.months[monthIdx] = !item.months[monthIdx];
                saveData();
            }
        }

        function resetForm() {
            document.getElementById('accountForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formTitleText').innerText = 'يېڭى ھېسابات كىرگۈزۈش';
            document.getElementById('saveBtnText').innerText = 'ئۆزگەرتىشنى ساقلاش';
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('editBadge').classList.add('hidden');
            document.getElementById('formCard').classList.remove('ring-2', 'ring-amber-500');
        }

        function togglePasswordInput() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

        function toggleCardPassword(el, actualPassword) {
            if (el.dataset.show === 'true') {
                el.innerText = '••••••';
                el.dataset.show = 'false';
            } else {
                el.innerText = actualPassword || '(مەخپىي نومۇر يوق)';
                el.dataset.show = 'true';
            }
        }

        function generateCardHTML(item) {
            const months = item.months || Array(12).fill(false);
            
            let monthsGridHTML = '';
            for (let i = 0; i < 12; i++) {
                const isPaid = months[i];
                const bgClass = isPaid 
                    ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' 
                    : 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/30';
                
                const icon = isPaid ? '✓' : '✕';
                const label = isPaid ? 'بەردى' : 'بەرمىدى';
                
                monthsGridHTML += `
                    <button type="button" onclick="toggleMonthStatus('${item.id}', ${i})" 
                        title="ھالەتنى ئۆزگەرتىش ئۈچۈن بېسىڭ"
                        class="${bgClass} border rounded-xl py-1.5 px-1 text-center text-xs font-bold hover:scale-105 transition flex flex-col items-center justify-center gap-0.5">
                        <span class="text-[10px] opacity-75">${i + 1}-ئاي</span>
                        <span class="text-[11px] font-extrabold flex items-center gap-0.5">
                            <span>${icon}</span>
                            <span>${label}</span>
                        </span>
                    </button>
                `;
            }

            return `
                <div class="glass-card p-5 rounded-3xl shadow-lg hover:shadow-xl transition-all duration-300 space-y-4 relative border border-slate-200/50 dark:border-slate-800">
                    
                    <!-- Top Info Header -->
                    <div class="flex flex-wrap items-start justify-between gap-3 border-b border-slate-200/60 dark:border-slate-800 pb-3">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-base sm:text-lg font-extrabold text-slate-800 dark:text-slate-100">${item.name}</h3>
                                <span class="text-[10px] bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 px-2 py-0.5 rounded-full font-bold">
                                    ھېسابات
                                </span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">ھېسابات نومۇرى: <span class="font-bold text-indigo-600 dark:text-indigo-400">${item.accountName}</span></p>
                        </div>

                        <!-- Card Action Buttons -->
                        <div class="flex items-center gap-2">
                            <button onclick="editRecord('${item.id}')" 
                                class="p-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 rounded-xl transition text-xs font-bold flex items-center gap-1 border border-amber-500/20">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                <span>تەھرىرلەش</span>
                            </button>
                            <button onclick="promptDelete('${item.id}')" 
                                class="p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-xl transition text-xs font-bold flex items-center gap-1 border border-rose-500/20">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                <span>ئۆچۈرۈش</span>
                            </button>
                        </div>
                    </div>

                    <!-- Details Grid -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 text-xs">
                        <div class="bg-slate-100/60 dark:bg-slate-900/60 p-2.5 rounded-xl">
                            <span class="text-slate-400 block text-[10px]">مەخپىي نومۇرى:</span>
                            <span onclick="toggleCardPassword(this, '${item.password}')" data-show="false" class="font-bold text-indigo-500 cursor-pointer select-none">••••••</span>
                        </div>
                        <div class="bg-slate-100/60 dark:bg-slate-900/60 p-2.5 rounded-xl">
                            <span class="text-slate-400 block text-[10px]">ئېقىم مىقدارى:</span>
                            <span class="font-bold text-slate-700 dark:text-slate-300">${item.flowAmount || '-'}</span>
                        </div>
                        <div class="bg-slate-100/60 dark:bg-slate-900/60 p-2.5 rounded-xl">
                            <span class="text-slate-400 block text-[10px]">ئاچقان ۋاقتى:</span>
                            <span class="font-bold text-slate-700 dark:text-slate-300">${item.openDate || '-'}</span>
                        </div>
                        <div class="bg-slate-100/60 dark:bg-slate-900/60 p-2.5 rounded-xl">
                            <span class="text-slate-400 block text-[10px]">كۇچا ئىسمى:</span>
                            <span class="font-bold text-slate-700 dark:text-slate-300">${item.streetName || '-'}</span>
                        </div>
                        <div class="bg-slate-100/60 dark:bg-slate-900/60 p-2.5 rounded-xl col-span-2 sm:col-span-1">
                            <span class="text-slate-400 block text-[10px]">ئۆي نومۇرى:</span>
                            <span class="font-bold text-slate-700 dark:text-slate-300">${item.houseNumber || '-'}</span>
                        </div>
                    </div>

                    ${item.notes ? `
                        <div class="bg-indigo-500/5 border-r-4 border-indigo-500 p-2.5 rounded-xl text-xs text-slate-600 dark:text-slate-300">
                            <span class="font-bold text-indigo-600 dark:text-indigo-400">ئىزاھات:</span> ${item.notes}
                        </div>
                    ` : ''}

                    <!-- 12 Months Grid Display -->
                    <div>
                        <span class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-2">12 ئايلىق پۇل تۆلەش ھالىتى:</span>
                        <div class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-12 gap-1.5">
                            ${monthsGridHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsArea = document.getElementById('searchResultsArea');
            const resultsList = document.getElementById('searchResultsList');
            const searchResultCount = document.getElementById('searchResultCount');
            const clearBtn = document.getElementById('clearSearchBtn');

            if (!query) {
                resultsArea.classList.add('hidden');
                clearBtn.classList.add('hidden');
                resultsList.innerHTML = '';
                return;
            }

            clearBtn.classList.remove('hidden');

            const filtered = records.filter(r => {
                return (r.name && r.name.toLowerCase().includes(query)) ||
                       (r.accountName && r.accountName.toLowerCase().includes(query)) ||
                       (r.streetName && r.streetName.toLowerCase().includes(query)) ||
                       (r.houseNumber && r.houseNumber.toLowerCase().includes(query));
            });

            resultsArea.classList.remove('hidden');
            searchResultCount.innerText = `ئىزدەش نەتىجىلىرى (${filtered.length}):`;

            if (filtered.length === 0) {
                resultsList.innerHTML = `<div class="p-6 text-center text-xs text-slate-400 bg-slate-100/50 dark:bg-slate-900/50 rounded-2xl">مۇناسىپ ھېسابات تېپىلمىدى.</div>`;
            } else {
                resultsList.innerHTML = filtered.map(item => generateCardHTML(item)).join('');
                lucide.createIcons();
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            handleSearch();
        }

        function renderRecords() {
            const container = document.getElementById('allRecordsContainer');

            if (records.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-10 text-center text-slate-400 rounded-3xl space-y-3">
                        <i data-lucide="folder-open" class="w-12 h-12 mx-auto text-indigo-400/50"></i>
                        <p class="text-sm font-bold">ھېچقانداق ھېسابات ساقلانمىغان.</p>
                        <p class="text-xs text-slate-400">ئۇستىدىكى جەدۋەلنى توشۇپ يېڭى ھېسابات كىرگۈزۈڭ.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = records.map(item => generateCardHTML(item)).join('');
            lucide.createIcons();
        }

        // Export JSON Data Backup
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `hesabat_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        // Import JSON Data Backup
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        records = imported;
                        saveData();
                        alert('زاپاس ئۇچۇرلار مۇۋەپپەقىيەتلىك يۈكلەندى!');
                    } else {
                        alert('ھۆججەت فورماتى خاتا.');
                    }
                } catch(err) {
                    alert('JSON ھۆججىتىنى ئوقۇشتا خەتالىق كۆرۈلدى.');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
